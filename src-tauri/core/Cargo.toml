[package]
name = "ukiyo-core"
version = "0.1.0"
description = "The ukiyo core: camera owner, catalog, recipes, the Lab, and the api every front end speaks"
edition = "2021"
license = "MIT"
rust-version = "1.89"
publish = false

[lib]
name = "ukiyo_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
libc = "0.2"
chrono = "0.4"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "indexmap"] }
nusb = "0.2.7"
indexmap = { version = "2", features = ["serde"] }
regex = "1.13"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# examples/recipes_refresh.rs: the recipe catalogue refresh.
ureq = "3.1"
roxmltree = "0.21"
