[package]
name = "ukiyo"
version = "0.1.0"
description = "Manage a Fujifilm X-series camera over USB"
edition = "2021"
license = "MIT"
rust-version = "1.89"
publish = false

[lib]
name = "ukiyo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = "0.4"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
nusb = "0.2.7"

[dev-dependencies]
tempfile = "3"
