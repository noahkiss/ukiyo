[package]
name = "ukiyo"
version = "0.1.0"
description = "Manage a Fujifilm X-series camera over USB"
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false
# The workspace has a second binary (ukiyo-cli); `cargo run` and `tauri dev` mean the app.
default-run = "ukiyo"

[workspace]
members = ["core", "cli"]
# Plain `cargo test` and `cargo clippy` in src-tauri cover the core and cli crates too.
default-members = [".", "core", "cli"]

[lib]
name = "ukiyo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
ukiyo-core = { path = "core" }
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "indexmap"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
tauri-plugin-opener = "2.7.2"

[dev-dependencies]
tempfile = "3"
